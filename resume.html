<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiersten Lyde-Stad Resume</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @page {
            size: 8.5in 11in;
            margin: 0;
        }
        body {
            font-family: 'Calibri Body', sans-serif;
            font-size: 12px;
            line-height: 1.3;
            margin: 0;
            padding: 0;
            color: #002145;
        }
        .page {
            width: 8.5in;
            height: 11in;
            display: grid;
            grid-template-rows: auto 1fr auto;
            grid-template-columns: [content-start] 6.5in [content-end];
            page-break-after: always;
            padding: 0.25in 1in 0.5in 1in;
            box-sizing: border-box;
            overflow: hidden;
        }
        .content {
            grid-column: content-start / content-end;
            grid-row: 2;
            overflow: hidden;
            padding: 0;
            position: relative;
            padding-bottom: 0.25in;
        }
        .content > .container:first-child {
            margin-top: 0;
        }
        .content > .container:first-child > p:first-child {
            margin-top: 5px;
        }
        .footer {
            grid-column: content-start / content-end;
            grid-row: 3;
            text-align: center;
        }
        .page:first-of-type .footer {
            display: none;
        }
        h1 {
            font-family: 'Calibri Body', sans-serif;
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 0;
            position: relative;
            z-index: 1;
            color: #002145;
        }
        h2 {
            font-family: 'Calibri Body', sans-serif;
            font-size: 12px;
            color: #002145;
            margin-bottom: 5px;
        }
        .container {
            width: 100%;
            margin: auto;
            overflow: hidden;
        }
        .section {
            margin-bottom: 20px;
        }
        ul {
            padding-left: 20px;
        }
        .center-text {
            text-align: center;
        }
        a, a:visited {
            color: #0000EE;
            text-decoration: underline;
        }
        .tech-line {
            list-style-type: none;
        }
        .header {
            grid-column: content-start / content-end;
            grid-row: 1;
            text-align: center;
            padding: 0;
            margin-bottom: 0.1in;
        }
    </style>
</head>
<body>
    <script src="info-data.js"></script>
    <script src="projects-data.js"></script>
    <script src="resume-render.js"></script>
    <script src="projects-render.js"></script>

    <!-- PAGE 1 -->
    <div class="page">
        <div class="header">
            <div id="header"></div>
            <script>renderHeader("header");</script>
        </div>
        <div class="content">
            <div class="container center-text">
                <div class="section">
                    <h2 style="text-align: left; margin-bottom: 0;">TECHNICAL SKILLS</h2>
                    <hr style="margin: 0; border-top: 1px solid black;">
                    <div id="skills-table"></div>
                </div>
                <script>renderSkillsTable("skills-table");</script>

                <div class="section">
                    <h2 style="text-align: left; margin-bottom: 0;">WORK EXPERIENCE</h2>
                    <hr style="margin: 0; border-top: 1px solid black;">
                    <div id="work-experience"></div>
                </div>
                <script>renderEntries("work-experience", INFO_DATA.work);</script>

                <div class="section">
                    <h2 style="text-align: left; margin-bottom: 0;">TECHNICAL PROJECTS</h2>
                    <hr style="margin: 0; border-top: 1px solid black;">
                    <div id="technical-projects-page1"></div>
                </div>
                <script>
                    const PROJECTS_PAGE_SPLIT = 3;
                    renderProjectsTable("technical-projects-page1", 
                        PROJECTS_DATA.projects.slice(0, PROJECTS_PAGE_SPLIT));
                </script>
            </div>
        </div>
        <div class="footer">
            <div id="footer-page1"></div>
            <script>renderFooter("footer-page1");</script>
        </div>
    </div>

    <!-- PAGE 2 -->
    <div class="page">
        <div class="content">
            <div class="container center-text">
                <div class="section">
                    <h2 style="text-align: left; margin-bottom: 0;">TECHNICAL PROJECTS (continued)</h2>
                    <hr style="margin: 0; border-top: 1px solid black;">
                    <div id="technical-projects-page2"></div>
                </div>
                <script>
                    renderProjectsTable("technical-projects-page2", 
                        PROJECTS_DATA.projects.slice(PROJECTS_PAGE_SPLIT));
                </script>

                <div class="section">
                    <h2 style="text-align: left; margin-bottom: 0;">VOLUNTEER EXPERIENCE</h2>
                    <hr style="margin: 0; border-top: 1px solid black;">
                    <div id="volunteer-experience"></div>
                </div>
                <script>renderEntries("volunteer-experience", INFO_DATA.volunteer);</script>

                <div class="section">
                    <h2 style="text-align: left; margin-bottom: 0;">EDUCATION</h2>
                    <hr style="margin: 0; border-top: 1px solid black;">
                    <div id="education"></div>
                </div>
                <script>renderEducation("education");</script>

                <div class="section">
                    <h2 style="text-align: left; margin-bottom: 0;">CERTIFICATIONS</h2>
                    <hr style="margin: 0; border-top: 1px solid black;">
                    <div id="certifications"></div>
                </div>
                <script>renderCertifications("certifications");</script>
            </div>
        </div>
        <div class="footer">
            <div id="footer-page2"></div>
            <script>renderFooter("footer-page2");</script>
        </div>
    </div>
</body>
</html>
