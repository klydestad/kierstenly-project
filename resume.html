<!DOCTYPE html>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiersten Lyde-Stad</title>
    <style>
        @page {
            size: 8.5in 11in;
            margin: 0;
        }
        body {
            font-family: 'Calibri Body', sans-serif;
            font-size: 12px;
            line-height: 1.3;
            margin: 0;
            padding: 0;
            color: #002145; /* UBC blue */
        }
        .page {
            width: 8.5in;
            height: 11in;
            display: grid;
            grid-template-rows: auto 1fr auto;
            grid-template-columns: [content-start] 6.5in [content-end]; /* Adjusted for 1-inch margins */
            page-break-after: always;
            padding: 0.25in 1in 0.5in 1in; /* Reduced top padding to 0.25 inch */
            box-sizing: border-box;
            overflow: hidden; /* Hide overflow */
        }
        .header {
            grid-column: content-start / content-end;
            grid-row: 1;
            text-align: right;
            padding: 0;
            margin-bottom: -0.67in;
            position: relative; /* For positioning the image */
            height: 1.5in; /* Set a fixed height for the header */
            overflow: visible;
        }
        .content {
            grid-column: content-start / content-end;
            grid-row: 2;
            overflow: hidden;
            padding: 0;
            position: relative;
            padding-bottom: 0.25in;
        }
        .content > .container:first-child {
            margin-top: 0;
        }
        .content > .container:first-child > p:first-child {
            margin-top: 5px;
        }
        .footer {
            grid-column: content-start / content-end;
            grid-row: 3;
            text-align: center;
        }
        .page:first-of-type .footer {
            display: none;
        }
        h1 {
            font-family: 'Calibri Body', sans-serif;
            font-size: 22px;
            margin-top: -10px;
            margin-bottom: 0;
            position: relative;
            z-index: 1;
            color: #002145; /* UBC blue */
        }
        h2 {
            font-family: 'Calibri Body', sans-serif;
            font-size: 12px;
            color: #002145; /* UBC blue */
            margin-bottom: 5px;
        }

        .container {
            width: 100%;
            margin: auto;
            overflow: hidden;
        }
        .section {
            margin-bottom: 20px;
        }
        ul {
            padding-left: 20px;
        }
        /* Add this CSS to center text and adjust margins */
        .center-text {
            text-align: center;
        }

        /* Add this new style for the title */
        title {
            font-family: 'Calibri Body', sans-serif;
            font-size: 22px;
        }

        /* Add this new style for links */
        a, a:visited {
            color: #0000EE; /* Default link blue color */
            text-decoration: underline;
        }

        /* Add this new style for the tech line */
        .tech-line {
            list-style-type: none;
        }


    </style>
</head>
<body>
    <script src="skills-data.js"></script>
    <script src="skills-render.js"></script>
    <script src="resume-data.js"></script>
    <script src="resume-render.js"></script>

    <div class="page">
        <div class="content">
            <div class="container center-text">
                <div id="header"></div>
                <script>renderHeader("header");</script>

                <div class="section">
                    <h2 style="text-align: left; margin-bottom: 0;">TECHNICAL SKILLS</h2>
                    <hr style="margin: 0; border-top: 1px solid black;">
                    <div id="skills-table"></div>
                </div>
                <script>renderSkillsTable("skills-table");</script>

                <div class="section">
                    <h2 style="text-align: left; margin-bottom: 0;">TECHNICAL WORK EXPERIENCE</h2>
                    <hr style="margin: 0; border-top: 1px solid black;">
                    <div id="technical-work"></div>
                </div>
                <script>renderEntries("technical-work", RESUME_DATA.technicalExperience);</script>

                <div class="section">
                    <h2 style="text-align: left; margin-bottom: 0;">TECHNICAL PROJECTS</h2>
                    <hr style="margin: 0; border-top: 1px solid black;">
                    <div id="technical-projects-page1"></div>
                </div>
                <script>
                    renderEntries(
                        "technical-projects-page1",
                        RESUME_DATA.projects.slice(0, PROJECTS_PAGE_SPLIT)
                    );
                </script>
            </div>
        </div>
        <div class="footer">
            <div id="footer-page1"></div>
            <script>renderFooter("footer-page1");</script>
        </div>
    </div>

    <div class="page">

        <br>

        <!-- Continuation of TECHNICAL PROJECTS from page 1 — no header repeated -->
        <div id="technical-projects-page2"></div>
        <script>
            renderEntries(
                "technical-projects-page2",
                RESUME_DATA.projects.slice(PROJECTS_PAGE_SPLIT)
            );
        </script>

            <div class="container center-text">
                <div class="section">
                    <h2 style="text-align: left; margin-bottom: 0;">WORK EXPERIENCE</h2>
                    <hr style="margin: 0; border-top: 1px solid black;">
                    <div id="work-experience"></div>
                </div>
                <script>renderEntries("work-experience", RESUME_DATA.workExperience);</script>

                <div class="section">
                    <h2 style="text-align: left; margin-bottom: 0;">VOLUNTEER EXPERIENCE</h2>
                    <hr style="margin: 0; border-top: 1px solid black;">
                    <div id="volunteer-experience"></div>
                </div>
                <script>renderEntries("volunteer-experience", RESUME_DATA.volunteerExperience);</script>

                <div class="section">
                    <h2 style="text-align: left; margin-bottom: 0;">EDUCATION</h2>
                    <hr style="margin: 0; border-top: 1px solid black;">
                    <div id="education"></div>
                </div>
                <script>renderEducation("education", RESUME_DATA.education);</script>

                <div class="section">
                    <h2 style="text-align: left; margin-bottom: 0;">CERTIFICATIONS</h2>
                    <hr style="margin: 0; border-top: 1px solid black;">
                    <div id="certifications"></div>
                </div>
                <script>renderCertifications("certifications", RESUME_DATA.certifications);</script>
            </div>
        </div>
        <div class="footer">
            <div id="footer-page2"></div>
            <script>renderFooter("footer-page2");</script>
        </div>
    </div>
</body>
</html>
